<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos In-Game</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #111827;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            color: white;
        }

        .wrapper {

            width: 1530px;
            max-width: 96%;
            background: #171F31;
            border-radius: 28px;
            border: 2px solid rgba(255, 255, 255, .05);
            padding: 30px;

        }

        .header {

            display: flex;
            align-items: center;
            gap: 22px;

        }

        .icon {

            width: 72px;
            height: 72px;
            border-radius: 20px;
            background: #1C2841;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            color: #59A5FF;
            border: 2px solid rgba(255, 255, 255, .04);

        }

        .header h1 {

            font-size: 54px;
            font-weight: 800;
            line-height: 1;

        }

        .header p {

            margin-top: 10px;
            color: #9EA8BD;
            font-size: 28px;

        }

        .divider {

            height: 1px;
            background: #2A3347;
            margin: 32px 0;

        }

        .game {

            background: #1B2437;
            border-radius: 24px;
            border: 2px solid rgba(255, 255, 255, .04);
            overflow: hidden;

        }

        .top {

            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 34px;

        }

        .left {

            display: flex;
            align-items: center;
            gap: 24px;

        }

        .avatar {

            width: 86px;
            height: 86px;
            border-radius: 18px;
            background: white;
            position: relative;
            overflow: hidden;

        }

        .avatar:before {

            content: "";
            position: absolute;
            width: 100%;
            height: 34%;
            bottom: 0;
            background: #26A6FF;

        }

        .avatar:after {

            content: "";
            position: absolute;
            width: 100%;
            height: 28%;
            bottom: 34%;
            background: #FFE530;

        }

        .face {

            position: absolute;
            left: 50%;
            top: 22px;
            transform: translateX(-50%);
            width: 34px;
            height: 34px;
            border-radius: 8px;
            background: #FFD84A;
        }

        .face:before {

            content: "";
            position: absolute;
            width: 38px;
            height: 6px;
            background: black;
            left: -2px;
            top: 0;
            border-radius: 4px;

        }

        .face:after {

            content: "◡";
            position: absolute;
            left: 8px;
            top: 8px;
            color: black;
            font-weight: bold;
            font-size: 16px;

        }

        .title {

            font-size: 44px;
            font-weight: 700;

        }

        .id {

            margin-top: 10px;
            color: #677189;
            font-size: 24px;

        }

        .badge {

            margin-left: 24px;
            padding: 10px 22px;
            border-radius: 999px;
            background: #2A3347;
            color: #B8C0D4;
            font-size: 22px;
            font-weight: 600;

        }

        .right {

            display: flex;
            align-items: center;
            gap: 34px;

        }

        .price {

            font-size: 48px;
            font-weight: 700;

        }

        .play {

            border: none;
            background: #21C45B;
            color: white;
            font-size: 28px;
            font-weight: 700;
            padding: 18px 34px;
            border-radius: 18px;
            cursor: pointer;

        }

        .arrow {

            font-size: 34px;
            color: #B6BFCE;

        }

        .bottom {

            border-top: 1px solid #2A3347;
            padding: 24px;

        }

        .product {

            background: #2A3142;
            border-radius: 22px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 26px;

        }

        .product-left {

            display: flex;
            align-items: center;
            gap: 22px;

        }

        .product-title {

            font-size: 34px;
            font-weight: 700;

        }

        .product-sub {

            margin-top: 8px;
            color: #9CA5BA;
            font-size: 24px;

        }

        .product-price {

            font-size: 42px;
            font-weight: 700;

        }

        @media(max-width:1200px) {

            .top {

                flex-direction: column;
                align-items: flex-start;
                gap: 30px;

            }

            .right {

                width: 100%;
                justify-content: space-between;

            }

            .header h1 {

                font-size: 40px;

            }

            .title {

                font-size: 32px;

            }

        }
    </style>

</head>

<body>

    <div class="wrapper">

        <div class="header">

            <div class="icon">🎮</div>

            <div>

                <h1>Productos In-Game</h1>
                <p>Organizados por juego</p>

            </div>

        </div>

        <div class="divider"></div>

        <div class="game">

            <div class="top">

                <div class="left">

                    <div class="avatar">
                        <div class="face"></div>
                    </div>

                    <div>

                        <div style="display:flex;align-items:center;">
                            <div class="title">Jujutsu Shenanigans</div>
                            <div class="badge">1 Item</div>
                        </div>

                        <div class="id">
                            ID: 0b46ef15-6a4e-4e0f-810f-5457f134492d
                        </div>

                    </div>

                </div>

                <div class="right">

                    <div class="price">S/0.69</div>

                    <button class="play">🎮 Jugar</button>

                    <div class="arrow">⌃</div>

                </div>

            </div>

            <div class="bottom">

                <div class="product">

                    <div class="product-left">

                        <div class="avatar">
                            <div class="face"></div>
                        </div>

                        <div>

                            <div class="product-title">Random Emote</div>
                            <div class="product-sub">Productos</div>

                        </div>

                    </div>

                    <div class="product-price">
                        S/0.69
                    </div>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
